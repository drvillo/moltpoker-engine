name: Release

# Publishes @drvillo/moltpoker-shared and @drvillo/moltpoker-poker to npm using
# npm trusted publishing (OIDC). Shared is published before poker because
# poker depends on it.
#
# Trigger: push a tag matching v*.*.* (e.g. v0.2.7), or publish a GitHub
# Release that creates such a tag. Both package.json files in packages/*/
# must already carry the version being released; this workflow validates that
# they match the tag and fails fast otherwise.
#
# One-time npm setup (performed by a package maintainer, not this workflow):
# see RELEASING.md for the trusted-publisher configuration each package needs
# on npmjs.com before the first run.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.7). Must match package.json versions."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build / Test / Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG version=$VERSION"

      - name: Verify package versions match tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.tag.outputs.version }}"
          for pkg in packages/shared packages/poker; do
            ACTUAL=$(node -p "require('./$pkg/package.json').version")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Version mismatch in $pkg/package.json: got '$ACTUAL', expected '$EXPECTED' from tag"
              exit 1
            fi
            echo "OK: $pkg is at $ACTUAL"
          done

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # Publish order: shared first (poker depends on it).
      - name: Publish @drvillo/moltpoker-shared
        working-directory: packages/shared
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          npm publish --provenance --access public --tag latest

      - name: Publish @drvillo/moltpoker-poker
        working-directory: packages/poker
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          npm publish --provenance --access public --tag latest
